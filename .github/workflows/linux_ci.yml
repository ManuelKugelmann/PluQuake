name: Linux CI
on: [push, pull_request]
jobs:
  build:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ["clang", "gcc"]
    steps:
    - uses: actions/checkout@v4
    - name: Install Build Tools
      run: sudo apt-get update && sudo apt-get install -y cmake gcc g++ make git libcurl4-openssl-dev libsdl2-dev libvorbis-dev libmpg123-dev
    - name: Build Ironwail (using prebuilt Linux/pluq/ libraries)
      run: make --jobs=3 --keep-going --directory=Quake CC=${{ matrix.compiler }}
